<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` return a
         real number. Without it those insets are 0 on every iPhone, so the
         bottom-sheet padding that clears the home indicator silently does
         nothing -- the CSS looks correct and has no effect. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Formula Lab</title>
    <meta
      name="description"
      content="Type a physics formula, fill in what you know, and solve for what you don't."
    />

    <!-- SVG first: one file, crisp at every size. The PNGs are for iOS, which
         will not use an SVG touch icon, and for the web manifest. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Safari 16.4+ reads `display` from the manifest; older iOS needs this to
         launch without browser chrome, and it costs nothing to keep. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Formula Lab" />
    <!-- `default`, not `black-translucent`: translucent slides the page under
         the status bar, which needs top inset padding everywhere to avoid the
         header sitting behind the clock. Not worth the complication. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Two values so the browser chrome matches whichever theme is in use. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="dark light" />

    <!-- Manrope for the interface, JetBrains Mono for formulas and numbers.
         preconnect so the font request does not wait on DNS and TLS, and
         display=swap so text paints in the fallback rather than not at all. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
