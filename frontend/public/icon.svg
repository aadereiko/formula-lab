<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Formula Lab">
  <!-- An isometric cube: three faces, each lit differently. The shading is
       what carries the depth, so it still reads as solid at 16px where any
       outline detail would disappear. -->
  <g stroke-linejoin="round" stroke-width="2">
    <!-- top -->
    <path d="M32 6 54 18.7 32 31.4 10 18.7Z" fill="#8FB3FF" stroke="#8FB3FF"/>
    <!-- left -->
    <path d="M10 18.7 32 31.4 32 58 10 45.3Z" fill="#4D8DFF" stroke="#4D8DFF"/>
    <!-- right -->
    <path d="M54 18.7 54 45.3 32 58 32 31.4Z" fill="#2454E6" stroke="#2454E6"/>
  </g>
</svg>
